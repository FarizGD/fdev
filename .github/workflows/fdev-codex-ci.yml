name: FDev Rust CI
on:
  push:
    branches: [main, 'fdev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: fdev
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: fdev
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: fdev.exe
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libcap-dev libasound2-dev cmake clang
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          save-if: 'true'
      - name: Validate workspace
        run: cargo metadata --no-deps --locked --format-version 1 > workspace-metadata.json
      - name: Check formatting of changed Rust files
        run: |
          rustfmt --edition 2024 --check cli/src/main.rs cli/tests/fdev.rs cli/src/provider_cmd.rs cli/src/repository_map.rs utils/cargo-bin/src/lib.rs utils/home-dir/src/lib.rs tui/src/update_action.rs tui/src/updates.rs cli/tests/update.rs
      - name: Static analysis
        run: cargo clippy -p codex-cli --bin fdev --locked
      - name: Unit tests
        run: cargo test --locked -p codex-utils-home-dir -p codex-model-provider-info -p codex-execpolicy --lib
      - name: Build FDev release binary
        run: cargo build --release --locked -p codex-cli --bin fdev
      - name: CLI integration test
        run: |
          cargo test --release --locked -p codex-cli --test fdev --test update
          cargo test --release --locked -p codex-cli --bin fdev provider_cmd::tests
          cargo test --release --locked -p codex-cli --bin fdev repository_map::tests
      - name: CLI smoke tests
        run: |
          ./target/release/${{ matrix.executable }} --version
          ./target/release/${{ matrix.executable }} --help
          ./target/release/${{ matrix.executable }} exec --help
      - name: Package binary and attribution
        run: |
          mkdir -p ../dist/fdev-${{ matrix.target }}/licenses
          cp target/release/${{ matrix.executable }} ../dist/fdev-${{ matrix.target }}/
          cp ../LICENSE.md ../README.md ../dist/fdev-${{ matrix.target }}/
          cp -R ../licenses/. ../dist/fdev-${{ matrix.target }}/licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: fdev-${{ matrix.target }}
          path: dist/fdev-${{ matrix.target }}/
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: codex-rs/workspace-metadata.json
          if-no-files-found: ignore
